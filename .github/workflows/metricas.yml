name: Atualizar métricas

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar métricas e gerar gráficos
        env:
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          GH_ORG: PlusFacilities
          TZ: America/Sao_Paulo
          DIAGNOSTICO: "true"
        run: python scripts/coletar_metricas.py

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualiza métricas de produtividade"
            git pull --rebase
            git push
          fi
